name: Change Request
description: Request a change to existing behaviour, configuration, or defaults
labels: ["change-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request a change to something that already exists
        (e.g. a different default, a renamed setting, a changed API endpoint).

  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: Describe how things work today.
    validations:
      required: true

  - type: textarea
    id: requested
    attributes:
      label: Requested change
      description: Describe exactly what you want changed and how it should behave afterwards.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason / motivation
      description: Why is this change needed? Who does it affect?
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How disruptive would this change be for existing users?
      options:
        - Low — no migration needed
        - Medium — settings or behaviour changes, easy to adapt
        - High — breaking change, migration required
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
