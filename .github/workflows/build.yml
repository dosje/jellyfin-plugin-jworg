name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JwOrg.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.JwOrg.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.JwOrg.sln --configuration Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can push back to main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore and build
        run: |
          dotnet restore Jellyfin.Plugin.JwOrg.sln
          dotnet build Jellyfin.Plugin.JwOrg.sln --configuration Release --no-restore

      - name: Publish plugin
        run: |
          dotnet publish src/Jellyfin.Plugin.JwOrg/Jellyfin.Plugin.JwOrg.csproj \
            --configuration Release --no-build --output artifacts/plugin

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Jellyfin expects four-part version: 0.1.0 → 0.1.0.0
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_FULL="${VERSION}.0"
          else
            VERSION_FULL="$VERSION"
          fi
          ZIP_NAME="Jellyfin.Plugin.JwOrg_${VERSION}.zip"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TARGET_ABI="10.11.0.0"

          mkdir -p dist
          cd artifacts/plugin
          zip -r "../../dist/${ZIP_NAME}" .
          cd ../..

          SHA256="$(sha256sum "dist/${ZIP_NAME}" | awk '{print $1}')"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"

          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "version_full=${VERSION_FULL}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}"         >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}"             >> "$GITHUB_OUTPUT"
          echo "source_url=${SOURCE_URL}"     >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}"       >> "$GITHUB_OUTPUT"
          echo "target_abi=${TARGET_ABI}"     >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        env:
          VER:        ${{ steps.pkg.outputs.version_full }}
          URL:        ${{ steps.pkg.outputs.source_url }}
          SHA:        ${{ steps.pkg.outputs.sha256 }}
          TS:         ${{ steps.pkg.outputs.timestamp }}
          ABI:        ${{ steps.pkg.outputs.target_abi }}
          TAG:        ${{ github.ref_name }}
        run: |
          # Read changelog from the tag annotation, fall back to generic message
          CHANGELOG="$(git tag -l --format='%(contents)' "$TAG" | head -20 || echo "See release notes.")"

          python3 - <<PYEOF
          import json, os
          path = "manifest.json"
          with open(path) as f:
              manifest = json.load(f)

          new_version = {
              "version":   os.environ["VER"],
              "changelog": os.environ.get("CHANGELOG", "See release notes."),
              "targetAbi": os.environ["ABI"],
              "sourceUrl": os.environ["URL"],
              "checksum":  os.environ["SHA"],
              "timestamp": os.environ["TS"],
          }

          # Keep existing real versions (non-placeholder, different version number)
          existing = [
              v for v in manifest[0]["versions"]
              if v.get("checksum", "") not in ("<sha256>", "")
              and v.get("version", "") != os.environ["VER"]
          ]
          manifest[0]["versions"] = [new_version] + existing

          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet \
            || git commit -m "chore: update manifest for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.pkg.outputs.zip_name }}
          generate_release_notes: true
