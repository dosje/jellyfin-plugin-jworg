name: Build

on:
  push:
    branches: ["main", "staging", "dev"]
    tags: ["v*"]
    # Skip CI for documentation-only changes
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "manifest.json"   # updated by CI itself — don't re-trigger
  pull_request:
    branches: ["main", "staging"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

# ──────────────────────────────────────────────────────────────
# CI — runs on every branch push and every PR
# ──────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JwOrg.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.JwOrg.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.JwOrg.sln --configuration Release --no-build

# ──────────────────────────────────────────────────────────────
# DEV artifact — push to dev → downloadable zip, no release
# ──────────────────────────────────────────────────────────────
  dev-artifact:
    name: Dev Artifact
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore & Build
        run: |
          dotnet restore Jellyfin.Plugin.JwOrg.sln
          dotnet build Jellyfin.Plugin.JwOrg.sln --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish src/Jellyfin.Plugin.JwOrg/Jellyfin.Plugin.JwOrg.csproj \
            --configuration Release --no-build --output artifacts/plugin

      - name: Package
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ZIP_NAME="Jellyfin.Plugin.JwOrg_dev-${SHORT_SHA}.zip"
          mkdir -p dist
          cd artifacts/plugin && zip -r "../../dist/${ZIP_NAME}" . && cd ../..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          retention-days: 7

# ──────────────────────────────────────────────────────────────
# BETA release — v*-beta.* or v*-rc.* tags → GitHub pre-release
# manifest.json is NOT updated (stable repo URL stays clean)
# ──────────────────────────────────────────────────────────────
  release-beta:
    name: Beta Release
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (contains(github.ref, '-beta.') || contains(github.ref, '-rc.'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore & Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet restore Jellyfin.Plugin.JwOrg.sln
          dotnet build Jellyfin.Plugin.JwOrg.sln --configuration Release --no-restore -p:Version="${VERSION}"

      - name: Publish
        run: |
          dotnet publish src/Jellyfin.Plugin.JwOrg/Jellyfin.Plugin.JwOrg.csproj \
            --configuration Release --no-build --output artifacts/plugin

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="Jellyfin.Plugin.JwOrg_${VERSION}.zip"
          mkdir -p dist
          cd artifacts/plugin && zip -r "../../dist/${ZIP_NAME}" . && cd ../..
          MD5="$(md5sum "dist/${ZIP_NAME}" | awk '{print $1}')"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum=${MD5}"      >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/${{ steps.pkg.outputs.zip_name }}
          generate_release_notes: true
          body: |
            > ⚠️ **Beta / Release Candidate** — for testing only.
            > Install manually: download the zip and drop its contents into your Jellyfin plugins folder.
            >
            > MD5: `${{ steps.pkg.outputs.checksum }}`

# ──────────────────────────────────────────────────────────────
# STABLE release — v* tags WITHOUT beta/rc suffix → full release
# Updates manifest.json and commits it back to main
# ──────────────────────────────────────────────────────────────
  release-stable:
    name: Stable Release
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-beta.') &&
      !contains(github.ref, '-rc.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore & Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet restore Jellyfin.Plugin.JwOrg.sln
          dotnet build Jellyfin.Plugin.JwOrg.sln --configuration Release --no-restore -p:Version="${VERSION}"

      - name: Publish
        run: |
          dotnet publish src/Jellyfin.Plugin.JwOrg/Jellyfin.Plugin.JwOrg.csproj \
            --configuration Release --no-build --output artifacts/plugin

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_FULL="${VERSION}.0"
          else
            VERSION_FULL="$VERSION"
          fi
          ZIP_NAME="Jellyfin.Plugin.JwOrg_${VERSION}.zip"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TARGET_ABI="10.11.0.0"

          mkdir -p dist
          cd artifacts/plugin && zip -r "../../dist/${ZIP_NAME}" . && cd ../..

          MD5="$(md5sum "dist/${ZIP_NAME}" | awk '{print $1}')"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"

          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "version_full=${VERSION_FULL}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}"         >> "$GITHUB_OUTPUT"
          echo "checksum=${MD5}"              >> "$GITHUB_OUTPUT"
          echo "source_url=${SOURCE_URL}"     >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}"       >> "$GITHUB_OUTPUT"
          echo "target_abi=${TARGET_ABI}"     >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        env:
          VER: ${{ steps.pkg.outputs.version_full }}
          URL: ${{ steps.pkg.outputs.source_url }}
          SHA: ${{ steps.pkg.outputs.checksum }}
          TS:  ${{ steps.pkg.outputs.timestamp }}
          ABI: ${{ steps.pkg.outputs.target_abi }}
          TAG: ${{ github.ref_name }}
        run: |
          CHANGELOG="$(git tag -l --format='%(contents:body)' "$TAG" | sed '/^Co-Authored-By:/d' | sed '/^$/d' | head -20 || echo "See release notes.")"
          export CHANGELOG
          python3 - <<PYEOF
          import json, os
          path = "manifest.json"
          with open(path) as f:
              manifest = json.load(f)
          new_version = {
              "version":   os.environ["VER"],
              "changelog": os.environ.get("CHANGELOG", "See release notes."),
              "targetAbi": os.environ["ABI"],
              "sourceUrl": os.environ["URL"],
              "checksum":  os.environ["SHA"],
              "timestamp": os.environ["TS"],
          }
          existing = [
              v for v in manifest[0]["versions"]
              if v.get("checksum", "") not in ("<sha256>", "<checksum>", "")
              and v.get("version", "") != os.environ["VER"]
          ]
          manifest[0]["versions"] = [new_version] + existing
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet \
            || git commit -m "chore: update manifest for ${{ github.ref_name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: dist/${{ steps.pkg.outputs.zip_name }}
          generate_release_notes: true
